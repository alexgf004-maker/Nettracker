name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sync
      - run: npm run test:import
      - run: npm run test:pre-campaign
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: interfaz-cpt
          path: test-results/**/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-pruebas
          path: test-results/
          retention-days: 7
